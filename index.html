<style>
:root {
  color-scheme: light dark;
  --paper:#f7f6f0; --sunk:#eceade; --ink:#191b16; --soft:#62655a; --hair:#d8d6c8; --home:#1663a5;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#171913; --sunk:#21241c; --ink:#e9ebe2; --soft:#9a9e91; --hair:#333629; --home:#3f8fdb;
  }
}
:root[data-theme="dark"] {
  --paper:#171913; --sunk:#21241c; --ink:#e9ebe2; --soft:#9a9e91; --hair:#333629; --home:#3f8fdb;
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
img { max-width:100%; }
body { background:var(--paper); color:var(--ink); font-family:var(--body); line-height:1.45;
  margin:0 auto; max-width:34rem; padding:0 0 3rem; }
.top { padding:1.6rem 1rem .8rem; text-align:center; }
.top img { display:block; height:auto; margin:0 auto .6rem; width:60%; }
.top h1 { font-family:var(--display); font-size:1.85rem; font-weight:600; letter-spacing:.09em;
  line-height:1.15; margin:0; text-indent:.09em; }
.top p { color:var(--soft); font-family:var(--display); font-size:1rem; letter-spacing:.12em; margin:.15rem 0 0; }
.links { display:grid; gap:1px; background:var(--hair); border-block:1px solid var(--hair); margin-top:1.4rem; }
a.card { background:var(--paper); color:inherit; display:block; padding:1rem; text-decoration:none; }
a.card:hover, a.card:focus-visible { background:var(--sunk); }
a.card:focus-visible { outline:2px solid var(--home); outline-offset:-2px; }
a.card h2 { color:var(--home); font-family:var(--display); font-size:1.2rem; letter-spacing:.1em;
  margin:0 0 .15rem; text-transform:uppercase; }
a.card span { color:var(--soft); font-size:.9rem; }
footer { color:var(--soft); font-size:.82rem; padding:1.2rem 1rem 0; text-align:center; }
</style>
</head>
